# ============================================================================
# Stack do pipeline medalhao Atv4
#
#   Airflow 3 (LocalExecutor) orquestra, via DockerOperator, containers
#   efemeros construidos a partir das imagens `ingestion_atv4` (Python +
#   Pydantic + Great Expectations) e `dbt_atv4` (dbt-postgres). O OpenMetadata
#   cataloga os schemas do Postgres.
#
#   Subir:   docker compose --profile build build && docker compose up -d
#   UIs:     Airflow 8081 | OpenMetadata 8585 | dbt docs 8181 | GE docs 8182
# ============================================================================

x-airflow-common:
  &airflow-common
  image: apache/airflow:3.3.1
  # A imagem regular ja traz os providers `docker` e `fab` (extras do build
  # oficial), entao nao ha Dockerfile proprio nem _PIP_ADDITIONAL_REQUIREMENTS.
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # O default da 3.3 e o SimpleAuthManager; com ele o entrypoint pula a
    # criacao do usuario web em silencio. Manter o FAB explicito.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres-db/${AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Sem esta variavel o scheduler procura a Execution API em localhost:8080
    # dentro do proprio container e as tasks ficam presas em `queued` sem erro.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API__BASE_URL: 'http://localhost:8081'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    _PIP_ADDITIONAL_REQUIREMENTS: ''
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags:z
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs:z
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config:z
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins:z
    # A DAG fala com o daemon por aqui para criar os containers irmaos.
    - /var/run/docker.sock:/var/run/docker.sock:z
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres-db:
      condition: service_healthy
  networks:
    &airflow-networks
    - private_network
    - front_network


x-openmetadata-common-env:
  &openmetadata-common-env
  # ---- servidor
  OPENMETADATA_CLUSTER_NAME: openmetadata
  SERVER_PORT: 8585
  SERVER_ADMIN_PORT: 8586
  SERVER_HOST_API_URL: http://openmetadata-server:8585/api
  LOG_LEVEL: INFO
  MIGRATION_LIMIT_PARAM: 1200
  # ---- banco (reaproveita o Postgres do pipeline, database proprio)
  DB_DRIVER_CLASS: org.postgresql.Driver
  DB_SCHEME: postgresql
  DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
  DB_HOST: postgres-db
  DB_PORT: 5432
  DB_USER: ${DB_USER:-postgres}
  DB_USER_PASSWORD: ${DB_PASSWORD:-postgrespassword}
  # Na linha 2.x a variavel e OM_DATABASE (era DB_DATABASE ate a 1.x).
  OM_DATABASE: openmetadata_db
  # ---- indice de busca (obrigatorio: o server nao sobe sem ele)
  SEARCH_TYPE: elasticsearch
  ELASTICSEARCH_HOST: elasticsearch
  ELASTICSEARCH_PORT: 9200
  ELASTICSEARCH_SCHEME: http
  ELASTICSEARCH_USER: ""
  ELASTICSEARCH_PASSWORD: ""
  ELASTICSEARCH_INDEX_MAPPING_LANG: EN
  # ---- autorizacao / autenticacao: modo basic, sem SSO (dev)
  AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
  AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
  AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
  AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN: '["all"]'
  AUTHORIZER_INGESTION_PRINCIPALS: "[ingestion-bot]"
  AUTHORIZER_PRINCIPAL_DOMAIN: "open-metadata.org"
  AUTHORIZER_ENFORCE_PRINCIPAL_DOMAIN: "false"
  AUTHORIZER_ENABLE_SECURE_SOCKET: "false"
  AUTHENTICATION_PROVIDER: basic
  AUTHENTICATION_PUBLIC_KEYS: "[http://localhost:8585/api/v1/system/config/jwks]"
  AUTHENTICATION_ENABLE_SELF_SIGNUP: "true"
  AUTHENTICATION_JWT_PRINCIPAL_CLAIMS: "[email,preferred_username,sub]"
  RSA_PUBLIC_KEY_FILE_PATH: "./conf/public_key.der"
  RSA_PRIVATE_KEY_FILE_PATH: "./conf/private_key.der"
  JWT_ISSUER: "open-metadata.org"
  JWT_KEY_ID: "Gb389a-9f76-gdjs-a92j-0242bk94356"
  # A ingestao e uma task da nossa DAG, nao do managed-apis do OpenMetadata.
  PIPELINE_SERVICE_CLIENT_ENABLED: "false"
  SECRET_MANAGER: db
  FERNET_KEY: ${OM_FERNET_KEY:-jJ/9sz0g0OHxsfxOoSfdFdmk3ysNmPRnH3TUAbz3IHA=}
  OPENMETADATA_HEAP_OPTS: "-Xmx768m -Xms512m"


services:

  # ------------------------------------------------------------------ dados
  postgres-db:
    # Tag fixa: o `postgres` sem tag hoje resolve para 18.x, que mudou PGDATA e
    # o ponto de VOLUME. O init.sql deste projeto e um dump da 17.5.
    image: postgres:17.11
    container_name: postgres_atv4
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - data_sql:/var/lib/postgresql/data:z
      # Roda uma unica vez, em volume vazio: cria os schemas do pipeline e os
      # databases do Airflow e do OpenMetadata.
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - private_network

  # ----------------------------------------------------------- OpenMetadata
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    container_name: openmetadata_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    volumes:
      - es_data:/usr/share/elasticsearch/data:z
    networks:
      - private_network

  # Bootstrap do schema do OpenMetadata. O server so sobe depois que este
  # container termina com exit 0.
  execute-migrate-all:
    image: docker.getcollate.io/openmetadata/server:2.0.1
    container_name: openmetadata_migrate
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment: *openmetadata-common-env
    depends_on:
      postgres-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - private_network

  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:2.0.1
    container_name: openmetadata_server
    restart: always
    environment: *openmetadata-common-env
    ports:
      - "8585:8585"
      - "8586:8586"
    depends_on:
      postgres-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      execute-migrate-all:
        condition: service_completed_successfully
    healthcheck:
      # A imagem do OpenMetadata nao traz curl — so wget. Com curl aqui o
      # healthcheck falha sempre, e o servidor aparece unhealthy mesmo
      # respondendo 200.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8586/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - private_network
      - front_network

  # --------------------------------------------------------------- Airflow
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
        chown -v -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8081:8080"
    restart: always
    healthcheck:
      # 8080 e a porta interna do container; 8081 e so a publicacao no host.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health').getcode()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks: *airflow-networks

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    # Com LocalExecutor e o scheduler que executa as tasks, entao e ele quem
    # precisa abrir /var/run/docker.sock. No Docker Desktop o socket aparece
    # como root:root 0660 dentro do container, inacessivel para o uid 50000.
    user: "0:0"
    healthcheck:
      # Como o servico roda como root e o Airflow esta instalado no user-site do
      # usuario `airflow` (/home/airflow/.local/...), o comando precisa ser
      # executado como ele — senao o healthcheck falha com ModuleNotFoundError
      # mesmo com o scheduler perfeitamente saudavel.
      test: ["CMD-SHELL", "su airflow -c 'airflow jobs check --job-type SchedulerJob'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks: *airflow-networks

  airflow-dag-processor:
    <<: *airflow-common
    # No Airflow 3 o parsing de DAGs saiu do scheduler e virou processo proprio.
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks: *airflow-networks

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks: *airflow-networks

  # --------------------------------------------------------- documentacao
  dbt-docs:
    image: nginx:alpine
    container_name: static_dbt
    volumes:
      - ./elt_dbt_atv4/target:/usr/share/nginx/html:ro
    ports:
      - "8181:80"
    networks:
      - front_network

  gx-docs:
    image: nginx:alpine
    container_name: static_gx
    volumes:
      # Data Docs escritos pelas tasks de qualidade no volume compartilhado.
      - gx_docs:/usr/share/nginx/html:ro
    ports:
      - "8182:80"
    networks:
      - front_network

  # ----------------------------------------------------- imagens das tasks
  # Estes dois servicos existem apenas para construir as imagens que a DAG
  # instancia (`docker compose --profile build build`). Nao sobem com `up`.
  app:
    image: ingestion_atv4
    build: .
    profiles:
      - build
    # Sem CMD/ENTRYPOINT na imagem: todo uso deste servico — pelo DockerOperator
    # do Airflow ou por `docker compose run --rm app <comando>` a mao — informa
    # o comando explicitamente. Ver a secao "Sem orquestrador" do README.
    env_file:
      - ${ENV_FILE_PATH:-.env}
    volumes:
      - ./data/raw_free:/app/data/raw:z
      - ./data/trusted_parquet:/app/trusted:z
      - ./data/delivered_gold:/app/delivered:z
      - gx_docs:/app/gx:z
    networks:
      - private_network

  elt_transformation:
    image: dbt_atv4
    build:
      context: .
      dockerfile: Dockerfile.dbt
    profiles:
      - build
    working_dir: /usr/app/dbt_atv4_project
    entrypoint: [""]
    command: ["dbt", "run"]
    env_file:
      - ${ENV_FILE_PATH:-.env}
    volumes:
      - ./elt_dbt_atv4:/usr/app/dbt_atv4_project:z
    networks:
      - private_network


volumes:

  data_sql:
    name: "data_sql"
    labels:
      description: "Postgresql persistent data storage"
  es_data:
    name: "es_data"
    labels:
      description: "Elasticsearch index storage for OpenMetadata"
  gx_docs:
    name: "gx_docs"
    labels:
      description: "Great Expectations data context and data docs"

networks:
  # Nome fixo: o `network_mode` do DockerOperator precisa do nome real da rede,
  # e sem `name:` ele dependeria do prefixo do projeto (o nome da pasta).
  private_network:
    name: atv4_private
    driver: bridge
  front_network:
    name: atv4_front
    driver: bridge
