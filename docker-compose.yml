version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. BANCO DE DADOS (POSTGRESQL)
  # ---------------------------------------------------------------------------
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atv4
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # Opcional: para criar schemas na inicialização
    networks:
      - streaming-net

  # ---------------------------------------------------------------------------
  # 2. BROKER DE MENSAGENS (ZOOKEEPER + KAFKA)
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - streaming-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Permite acesso interno (entre containers em kafka:9092) e externo (no host em localhost:29092)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - streaming-net

  # ---------------------------------------------------------------------------
  # 3. CONSUMIDOR PYSPARK (STREAMING)
  # ---------------------------------------------------------------------------
  pyspark-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyspark-consumer
    depends_on:
      - kafka
      - postgres-db
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: atv4
    volumes:
      - .:/app
    # Executa o consumer garantindo o download dos pacotes do Kafka e Postgres JDBC
    command: >
      spark-submit 
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.6.0 
      /app/consumer.py
    networks:
      - streaming-net

  # ---------------------------------------------------------------------------
  # 4. PRODUTOR PYTHON (RAW INGESTION)
  # ---------------------------------------------------------------------------
  python-producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-producer
    depends_on:
      - kafka
      - pyspark-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - .:/app
    command: python /app/producer.py
    networks:
      - streaming-net

volumes:
  postgres_data:

networks:
  streaming-net:
    driver: bridge