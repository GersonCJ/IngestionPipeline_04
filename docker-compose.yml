version: '3.8'

services:

  # ------------------------------------------------------------------ Banco SQL (Enriquecimento)
  postgres-db:
    image: postgres:17.1
    container_name: postgres_atv8
    restart: always
    environment:
      POSTGRES_USER: ${TARGET_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${TARGET_DB_NAME:-target_db}
    ports:
      - "5432:5432" # Exposto para conexão JDBC local do PySpark
    volumes:
      - data_sql:/var/lib/postgresql/data:z
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${TARGET_DB_USER:-postgres}", "-d", "${TARGET_DB_NAME:-target_db}"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - streaming_network

  # ------------------------------------------------------------------ Mensageria (Kafka + ZooKeeper)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper_atv8
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - streaming_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_atv8
    ports:
      - "9092:9092" # Exposto para o Produtor Python e PySpark
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - streaming_network

  # ------------------------------------------------------------------ Interface Gráfica do Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui_atv8
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - streaming_network

  pyspark-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: pyspark_consumer_atv8
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - TARGET_DB_HOST=postgres-db
      - TARGET_DB_NAME=target_db
      - TARGET_DB_USER=postgres
      - DB_PASSWORD=postgrespassword
    depends_on:
      kafka:
        condition: service_started
      postgres-db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - streaming_network