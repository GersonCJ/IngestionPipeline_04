version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. BANCO DE DADOS (POSTGRESQL)
  # ---------------------------------------------------------------------------
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atv4 
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - streaming-net

  # ---------------------------------------------------------------------------
  # 2. BROKER DE MENSAGENS (ZOOKEEPER + KAFKA)
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - streaming-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29093:29093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - streaming-net

  # ---------------------------------------------------------------------------
  # 3. CONSUMIDOR PYSPARK (STREAMING)
  # ---------------------------------------------------------------------------
  pyspark-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyspark-consumer
    depends_on:
      kafka:
        condition: service_healthy
      postgres-db:
        condition: service_started
    environment:
      - TARGET_DB_HOST=postgres-db
      - TARGET_DB_PORT=5432
      - TARGET_DB_NAME=atv4
      - TARGET_DB_USER=postgres
      - TARGET_DB_PASS=postgres
    volumes:
      - ./kafka:/app/kafka
    command: ["uv", "run", "python", "/app/kafka/consumer.py"]
    networks:
      - streaming-net

  # ---------------------------------------------------------------------------
  # 4. PRODUTOR PYTHON (RAW INGESTION)
  # ---------------------------------------------------------------------------
  python-producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-producer
    depends_on:
      kafka:
        condition: service_healthy
      postgres-db:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./kafka:/app/kafka
    command: ["uv", "run", "python", "/app/kafka/producer.py"]
    networks:
      - streaming-net

volumes:
  postgres_data:

networks:
  streaming-net:
    driver: bridge