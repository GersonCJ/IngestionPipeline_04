source:
  type: postgres
  serviceName: postgres_atv4
  serviceConnection:
    config:
      type: Postgres
      hostPort: "${DB_HOST}:"
      username: "${DB_USER}"
      authType:
        password: "${DB_PASSWORD}"
      database: "${DB_NAME}"
  sourceConfig:
    config:
      type: DatabaseMetadata
      markDeletedTables: true
      includeTables: true
      includeViews: true

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  openMetadataServerConfig:
    hostPort: "${OM_SERVER_URL}"
    authProvider: openmetadata
    securityConfig:
      jwtToken: "${OM_JWT_TOKEN}"
